# separate terms of service, privacy policy, and support
# documentation.

name: Ruby

env:
  SECRETS_TOKEN: ${{ secrets.PAT }}

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      # Крок змінено: тепер використовується ваш PAT для перевірки користувачів організації
      - name: Add outside users to organization
        run: |
          users=$(curl -L -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository_owner }}/${{ github.event.repository.name }}/collaborators?affiliation=outside \
            | jq '.[] .id')
          for user in $users
          do
            curl -s -L -o /dev/null \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.PAT }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/orgs/${{ github.repository_owner }}/invitations \
              -d "{\"invitee_id\": $user}"
          done
          
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: '.github/tests'
          bundler-cache: true
          
      # Крок змінено: передаємо ваш PAT безпосередньо у тести для фінальної перевірки завдання
      - name: Run tests
        env:
          URL: ${{ github.repository }}
          TOKEN: ${{ secrets.PAT }}
        working-directory: '.github/tests'
        run: 
          ruby test/script_test.rb
